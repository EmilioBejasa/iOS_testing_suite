name: QuoteBox
options:
  bundleIdPrefix: com.quotebox.qa
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

packages:
  iOSTestKit:
    path: .

targets:
  QuoteBox:
    type: application
    platform: iOS
    sources:
      - path: QuoteBox
    dependencies:
      - package: iOSTestKit
        product: TimeControl
      - package: iOSTestKit
        product: LocalNotifications
      - package: iOSTestKit
        product: DeepLinkTesting
      - package: iOSTestKit
        product: PurchaseSupport
      - package: iOSTestKit
        product: DebugOverlay
    info:
      path: QuoteBox/Info.plist
      properties:
        CFBundleDisplayName: QuoteBox
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.quotebox.qa.app
            CFBundleURLSchemes:
              - quotebox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quotebox.qa.app
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: QuoteBox/QuoteBox.entitlements

  QuoteBoxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: QuoteBoxTests
    resources:
      - path: QuoteBoxTests/Configuration.storekit
    dependencies:
      - target: QuoteBox
        embed: false
      - package: iOSTestKit
        product: NetworkStub
      - package: iOSTestKit
        product: TimeControl
      - package: iOSTestKit
        product: KeychainStore
      - package: iOSTestKit
        product: CoreDataTestSupport
      - package: iOSTestKit
        product: LocalNotifications
      - package: iOSTestKit
        product: SnapshotTesting
      - package: iOSTestKit
        product: DeepLinkTesting
      - package: iOSTestKit
        product: LocationAuthorization
      - package: iOSTestKit
        product: PurchaseSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quotebox.qa.tests
        GENERATE_INFOPLIST_FILE: YES

  QuoteBoxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: QuoteBoxUITests
    dependencies:
      - target: QuoteBox
        embed: false
      - package: iOSTestKit
        product: UITestHelpers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quotebox.qa.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: QuoteBox

schemes:
  QuoteBox:
    build:
      targets:
        QuoteBox: all
        QuoteBoxTests: [test]
        QuoteBoxUITests: [test]
    test:
      targets:
        - QuoteBoxTests
        - QuoteBoxUITests
    run:
      config: Debug
      storeKitConfiguration: QuoteBoxTests/Configuration.storekit
