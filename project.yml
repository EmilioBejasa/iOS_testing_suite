name: Weather
options:
  bundleIdPrefix: com.weather.qa
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"

targets:
  Weather:
    type: application
    platform: iOS
    sources:
      - path: Weather
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weather.qa.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Weather
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_STYLE: Automatic

  WeatherTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WeatherTests
    dependencies:
      - target: Weather
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weather.qa.tests
        GENERATE_INFOPLIST_FILE: YES

  WeatherUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WeatherUITests
    dependencies:
      - target: Weather
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weather.qa.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Weather

schemes:
  Weather:
    build:
      targets:
        Weather: all
        WeatherTests: [test]
        WeatherUITests: [test]
    test:
      targets:
        - WeatherTests
        - WeatherUITests
    run:
      config: Debug
