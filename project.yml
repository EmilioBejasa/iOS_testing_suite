name: QuoteBox
options:
  bundleIdPrefix: com.quotebox.qa
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

packages:
  iOSTestKit:
    path: .

targets:
  QuoteBox:
    type: application
    platform: iOS
    sources:
      - path: QuoteBox
    dependencies:
      - package: iOSTestKit
        product: TimeControl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quotebox.qa.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: QuoteBox
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: QuoteBox/QuoteBox.entitlements

  QuoteBoxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: QuoteBoxTests
    dependencies:
      - target: QuoteBox
        embed: false
      - package: iOSTestKit
        product: NetworkStub
      - package: iOSTestKit
        product: TimeControl
      - package: iOSTestKit
        product: KeychainStore
      - package: iOSTestKit
        product: CoreDataTestSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quotebox.qa.tests
        GENERATE_INFOPLIST_FILE: YES

  QuoteBoxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: QuoteBoxUITests
    dependencies:
      - target: QuoteBox
        embed: false
      - package: iOSTestKit
        product: UITestHelpers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quotebox.qa.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: QuoteBox

schemes:
  QuoteBox:
    build:
      targets:
        QuoteBox: all
        QuoteBoxTests: [test]
        QuoteBoxUITests: [test]
    test:
      targets:
        - QuoteBoxTests
        - QuoteBoxUITests
    run:
      config: Debug
