name: Record Snapshot

# Records a new SnapshotTesting reference image for a single test identifier
# and uploads it as an artifact, for anyone who needs to add/update a
# snapshot but doesn't have a local Mac with Xcode/Simulator - see
# SnapshotTesting's SNAPSHOT_RECORD=1 env var (Sources/SnapshotTesting).
# Deliberately manual (workflow_dispatch only): recording overwrites the
# comparison target rather than verifying against it, so it should never run
# unattended.

on:
  workflow_dispatch:
    inputs:
      scheme:
        description: The Xcode scheme to test
        required: true
        type: string
      project:
        description: Path to the .xcodeproj (relative to repo root)
        required: true
        type: string
      only_testing:
        description: Test identifier to record (e.g. "QuoteBoxTests/QuoteViewSnapshotTests/testFoo")
        required: true
        type: string
      device:
        description: Simulator device name to render with
        required: false
        type: string
        default: "iPhone 16"
      xcodegen:
        description: Whether to run `xcodegen generate` before testing
        required: false
        type: boolean
        default: true

jobs:
  record:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        if: inputs.xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        if: inputs.xcodegen
        run: xcodegen generate

      - name: Record snapshot
        env:
          PROJECT: ${{ inputs.project }}
          SCHEME: ${{ inputs.scheme }}
          DEVICE_NAME: ${{ inputs.device }}
          ONLY_TESTING: ${{ inputs.only_testing }}
          SNAPSHOT_RECORD: "1"
        run: |
          # assertSnapshot deliberately fails the test even while recording
          # (see Sources/SnapshotTesting/assertSnapshot.swift), so a non-zero
          # exit here is expected - what matters is the artifact upload below.
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=$DEVICE_NAME" \
            -only-testing:"$ONLY_TESTING" \
            CODE_SIGNING_ALLOWED=NO || true

      - name: Upload recorded snapshot
        uses: actions/upload-artifact@v4
        with:
          name: recorded-snapshot
          path: '**/__Snapshots__/**'
          if-no-files-found: error
