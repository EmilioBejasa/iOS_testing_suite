name: Reusable iOS Test Suite

on:
  workflow_call:
    inputs:
      scheme:
        description: The Xcode scheme to test
        required: true
        type: string
      project:
        description: Path to the .xcodeproj (relative to repo root)
        required: true
        type: string
      devices:
        description: JSON array of simulator device names to run the matrix against
        required: false
        type: string
        default: '["iPhone 16"]'
      xcodegen:
        description: Whether to run `xcodegen generate` before testing
        required: false
        type: boolean
        default: true
      enable_coverage:
        description: Whether to collect and report code coverage
        required: false
        type: boolean
        default: true
      skip_testing:
        description: Space-separated test identifiers to exclude (e.g. "MyTests/LiveContractTests")
        required: false
        type: string
        default: ""
      snapshot_reference_device:
        description: >-
          The one device name (matching an entry in `devices`) whose native
          display scale/text rendering `snapshot_testing_identifiers`'
          reference images were recorded against. Those identifiers are
          skipped on every other device in the matrix. Empty (default)
          applies no such exclusion.
        required: false
        type: string
        default: ""
      snapshot_testing_identifiers:
        description: >-
          Space-separated test identifiers (pixel-comparison snapshot tests)
          to skip on every device except `snapshot_reference_device`.
        required: false
        type: string
        default: ""
      coverage_baseline_file:
        description: Path to a file containing the minimum acceptable line-coverage percentage. Skipped when empty.
        required: false
        type: string
        default: ""
      extra_known_flake_pattern:
        description: >-
          Extended-regex (grep -E syntax) OR'd into the built-in known-flake
          retry pattern below, for a calling repo's own known flakes. The
          built-in pattern is tuned to this kit's own QuoteBox proving-ground
          app and won't match another app's failures, so it's harmless left
          at the default (empty) - set this once your own CI has a
          characterized flake signature you want retried instead of failing
          the run outright.
        required: false
        type: string
        default: ""

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        destination_name: ${{ fromJSON(inputs.devices) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        if: inputs.xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        if: inputs.xcodegen
        run: xcodegen generate

      - name: Compute artifact-safe device slug
        id: device
        run: echo "slug=$(echo '${{ matrix.destination_name }}' | tr -c '[:alnum:]' '_')" >> "$GITHUB_OUTPUT"

      - name: Run tests
        shell: bash
        env:
          PROJECT: ${{ inputs.project }}
          SCHEME: ${{ inputs.scheme }}
          DEVICE_NAME: ${{ matrix.destination_name }}
          SKIP_TESTING: ${{ inputs.skip_testing }}
          SNAPSHOT_REFERENCE_DEVICE: ${{ inputs.snapshot_reference_device }}
          SNAPSHOT_TESTING_IDENTIFIERS: ${{ inputs.snapshot_testing_identifiers }}
          ENABLE_COVERAGE: ${{ inputs.enable_coverage }}
          EXTRA_KNOWN_FLAKE_PATTERN: ${{ inputs.extra_known_flake_pattern }}
        run: |
          SKIP_ARGS=()
          for id in $SKIP_TESTING; do
            SKIP_ARGS+=("-skip-testing:$id")
          done
          if [ -n "$SNAPSHOT_REFERENCE_DEVICE" ] && [ "$DEVICE_NAME" != "$SNAPSHOT_REFERENCE_DEVICE" ]; then
            for id in $SNAPSHOT_TESTING_IDENTIFIERS; do
              SKIP_ARGS+=("-skip-testing:$id")
            done
          fi

          COVERAGE_FLAG="NO"
          if [ "$ENABLE_COVERAGE" = "true" ]; then
            COVERAGE_FLAG="YES"
          fi

          # Retry only on the specific flake signatures this repo has actually hit
          # (simulator provisioning, StoreKit config propagation, accessibility
          # audit timeout) - never on a plain test/compile failure, so a real
          # regression still fails fast instead of being silently retried.
          #
          # This pattern is tuned to QuoteBox's own known flakes, not a generic
          # baseline - notably the `tipJar\.button`/`supporter\.button` "Failed
          # to get matching snapshot" signature below is specific to QuoteBox's
          # real-StoreKit-purchase UI tests: both tap a button whose accessibility
          # element can transiently fail to resolve on iPad's accessibility tree
          # (same root cause, same failure shape, confirmed independently for
          # each button - not a generic "any element not found" catch-all, which
          # would also swallow a real regression). A repo calling this reusable
          # workflow should assume this list doesn't apply to it and instead
          # pass its own characterized flake signatures via the
          # `extra_known_flake_pattern` input, OR'd in below.
          #
          # testCollectsRealTransactionUpdateAfterPurchase's two failure modes
          # (Transaction.updates never posting within the timeout, or the
          # sandbox handing back a transaction StoreKitTest can't decode -
          # "missingValue ... advancedCommerceInfo") are matched narrowly to
          # that one test's known signatures rather than "any failure in
          # AsyncSequenceCollectingTests", so a real regression in
          # AsyncSequenceCollecting.collect() itself still fails fast.
          #
          # testQuoteContentViewLoadedNewLayoutAccessibility3/
          # testRootViewQuoteTabLoaded/testQuoteViewErrorState fail
          # intermittently on phone-class simulators with a several-hundred-byte
          # mismatch against the committed reference PNG (confirmed not a stale
          # reference - a fresh local re-recording is byte-identical to what's
          # committed), most likely Xcode's randomized test-order leaving the
          # font/rendering cache in a slightly different state depending on
          # whatever ran immediately before. Matched narrowly by test name so a
          # genuine layout regression in QuoteContentView/RootView still fails
          # fast.
          KNOWN_FLAKE_PATTERN='Unable to find a device matching the provided destination specifier|Failed to get matching snapshot.*(tipJar|supporter)\.button|Audit failed to complete in time|testCollectsRealTransactionUpdateAfterPurchase.*(timedOut\(collected: 0, expected: 1\)|missingValue\(for:.*advancedCommerceInfo)|(testQuoteContentViewLoadedNewLayoutAccessibility3|testRootViewQuoteTabLoaded|testQuoteViewErrorState)\].*doesn.t match the reference image'
          if [ -n "$EXTRA_KNOWN_FLAKE_PATTERN" ]; then
            KNOWN_FLAKE_PATTERN="${KNOWN_FLAKE_PATTERN}|${EXTRA_KNOWN_FLAKE_PATTERN}"
          fi

          attempt=1
          max_attempts=3
          while true; do
            rm -rf TestResults.xcresult

            set +e
            xcodebuild test \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -destination "platform=iOS Simulator,name=$DEVICE_NAME" \
              "${SKIP_ARGS[@]}" \
              -enableCodeCoverage "$COVERAGE_FLAG" \
              -resultBundlePath TestResults.xcresult \
              CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log
            exit_code=${PIPESTATUS[0]}
            set -e

            if [ "$exit_code" -eq 0 ]; then
              break
            fi

            if [ "$attempt" -ge "$max_attempts" ] || ! grep -qE "$KNOWN_FLAKE_PATTERN" build.log; then
              exit "$exit_code"
            fi

            echo "::warning::Known flake detected (attempt $attempt/$max_attempts) - retrying in 15s..."
            attempt=$((attempt + 1))
            sleep 15
          done

      - name: Report code coverage
        if: always() && inputs.enable_coverage
        run: |
          xcrun xccov view --report --json TestResults.xcresult > coverage.json
          python3 -c "
          import json
          data = json.load(open('coverage.json'))
          pct = data['lineCoverage'] * 100
          print(f'Overall line coverage: {pct:.1f}%')
          " | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Enforce coverage floor
        # Only gate the device actually running the full test suite - when
        # snapshot_reference_device skips some tests on every other device,
        # those devices' own coverage numbers are expected to be lower by
        # design, not a regression to fail on.
        if: >-
          always() && inputs.enable_coverage && inputs.coverage_baseline_file != '' &&
          (inputs.snapshot_reference_device == '' || matrix.destination_name == inputs.snapshot_reference_device)
        run: |
          pct=$(python3 -c "import json; print(json.load(open('coverage.json'))['lineCoverage']*100)")
          baseline=$(cat "${{ inputs.coverage_baseline_file }}" 2>/dev/null || echo 0)
          python3 -c "
          pct=$pct
          baseline=$baseline
          if pct < baseline - 0.5:
              raise SystemExit(f'Coverage {pct:.1f}% dropped more than 0.5pt below baseline {baseline:.1f}%')
          print(f'Coverage {pct:.1f}% (baseline {baseline:.1f}%) OK')
          "

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ steps.device.outputs.slug }}
          path: TestResults.xcresult

      - name: Upload snapshot test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ steps.device.outputs.slug }}
          path: '**/__Snapshots__/**'
          if-no-files-found: ignore
