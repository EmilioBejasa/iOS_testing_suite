name: iOS Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/reusable-test.yml
    with:
      scheme: QuoteBox
      project: QuoteBox.xcodeproj
      devices: '["iPhone 16", "iPhone SE (3rd generation)", "iPad (10th generation)"]'
      # DummyJSONLiveContractTests hits a real network API; runs on a schedule
      # via live-api-contract.yml instead.
      skip_testing: "QuoteBoxTests/DummyJSONLiveContractTests"

  # Fast feedback on the macOS-runnable subset of kit-only tests. Doesn't need
  # XcodeGen or the QuoteBox app at all — just the bare Package.swift.
  #
  # Retries on the same StoreKit-sandbox flake signature reusable-test.yml's
  # `test` job already retries (see its own comment for the full story) -
  # this job hits it too, since it runs the same AsyncSequenceCollectingTests.
  swift-test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        run: |
          KNOWN_FLAKE_PATTERN='testCollectsRealTransactionUpdateAfterExternalPurchase.*(timedOut\(collected: 0, expected: 1\)|missingValue\(for:.*advancedCommerceInfo)'
          attempt=1
          max_attempts=3
          while true; do
            set +e
            swift test 2>&1 | tee build.log
            exit_code=${PIPESTATUS[0]}
            set -e
            if [ "$exit_code" -eq 0 ]; then break; fi
            if [ "$attempt" -ge "$max_attempts" ] || ! grep -qE "$KNOWN_FLAKE_PATTERN" build.log; then
              exit "$exit_code"
            fi
            echo "::warning::Known flake detected (attempt $attempt/$max_attempts) - retrying in 15s..."
            attempt=$((attempt + 1))
            sleep 15
          done

  # The kit-only test targets whose Sources/ modules import an iOS-only
  # framework (UIKit, HealthKit, etc.) build empty under `swift test` on
  # macOS - see the `#if os(iOS)` guards in Package.swift. This job runs
  # their real assertions against an iOS Simulator destination, still against
  # the bare Package.swift, no XcodeGen/QuoteBox app needed. Kept as a
  # separate job (not folded into `test` above) because after project.yml's
  # `QuoteBoxTests` bundle was trimmed to just its 8 app-dependent files, the
  # `QuoteBox` scheme no longer exercises these modules at all - without this
  # job they'd lose simulator coverage entirely.
  #
  # Also retries on a destination-discovery flake specific to a bare
  # Package.swift's auto-synthesized scheme: on a freshly-started runner,
  # xcodebuild has occasionally reported only generic platform placeholders
  # (no concrete simulators) for "iOSTestKit-Package"'s available
  # destinations, then lists them fully on a subsequent attempt - looks like
  # CoreSimulator not being fully warmed up yet, not a real destination
  # mismatch (the same device names work fine for the QuoteBox.xcodeproj
  # scheme in the `test` job above).
  kit-tests-ios:
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        destination_name: ["iPhone 16", "iPhone SE (3rd generation)", "iPad (10th generation)"]
    steps:
      - uses: actions/checkout@v4
      - name: Run kit tests against Package.swift
        run: |
          KNOWN_FLAKE_PATTERN='Unable to find a device matching the provided destination specifier|testCollectsRealTransactionUpdateAfterExternalPurchase.*(timedOut\(collected: 0, expected: 1\)|missingValue\(for:.*advancedCommerceInfo)'
          attempt=1
          max_attempts=3
          while true; do
            set +e
            xcodebuild test \
              -scheme iOSTestKit-Package \
              -destination "platform=iOS Simulator,name=${{ matrix.destination_name }}" \
              CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log
            exit_code=${PIPESTATUS[0]}
            set -e
            if [ "$exit_code" -eq 0 ]; then break; fi
            if [ "$attempt" -ge "$max_attempts" ] || ! grep -qE "$KNOWN_FLAKE_PATTERN" build.log; then
              exit "$exit_code"
            fi
            echo "::warning::Known flake detected (attempt $attempt/$max_attempts) - retrying in 15s..."
            attempt=$((attempt + 1))
            sleep 15
          done

  # Report-only for now: flips to `--strict` once a first run establishes how
  # much of the existing codebase already violates the default ruleset.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: norio-nomura/action-swiftlint@3.2.1
