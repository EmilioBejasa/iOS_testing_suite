name: iOS Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/reusable-test.yml
    with:
      scheme: Weather
      project: Weather.xcodeproj
      devices: '["iPhone 16", "iPhone SE (3rd generation)", "iPad (10th generation)"]'
      skip_testing: "WeatherTests/OpenMeteoLiveContractTests"
