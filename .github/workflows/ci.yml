name: iOS Build

on:
  push:
    branches: [verify-portability-quotebox]
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/reusable-test.yml
    with:
      scheme: QuoteBox
      project: QuoteBox.xcodeproj
      devices: '["iPhone 16", "iPad (10th generation)"]'
      skip_testing: "QuoteBoxTests/DummyJSONLiveContractTests"
