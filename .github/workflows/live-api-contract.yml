name: Live DummyJSON Contract Check

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    uses: ./.github/workflows/reusable-live-contract.yml
    with:
      scheme: QuoteBox
      project: QuoteBox.xcodeproj
      only_testing: "QuoteBoxTests/DummyJSONLiveContractTests"
