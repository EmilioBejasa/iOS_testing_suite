name: Reusable Live API Contract Check

on:
  workflow_call:
    inputs:
      scheme:
        description: The Xcode scheme to test
        required: true
        type: string
      project:
        description: Path to the .xcodeproj (relative to repo root)
        required: true
        type: string
      only_testing:
        description: Test identifier to run against the live network (e.g. "MyTests/LiveContractTests")
        required: true
        type: string
      device:
        description: Simulator device name to run against
        required: false
        type: string
        default: "iPhone 16"
      xcodegen:
        description: Whether to run `xcodegen generate` before testing
        required: false
        type: boolean
        default: true

jobs:
  contract:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        if: inputs.xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        if: inputs.xcodegen
        run: xcodegen generate

      - name: Run live contract tests
        env:
          PROJECT: ${{ inputs.project }}
          SCHEME: ${{ inputs.scheme }}
          DEVICE_NAME: ${{ inputs.device }}
          ONLY_TESTING: ${{ inputs.only_testing }}
        run: |
          # Retry only on the simulator-discovery flake this kit's own CI has
          # hit (CoreSimulator not fully warmed up on a fresh runner) - see
          # the same pattern in ci.yml's kit-tests-ios job and
          # reusable-test.yml's KNOWN_FLAKE_PATTERN. A real contract failure
          # (the live API actually broke) still fails fast on attempt 1.
          KNOWN_FLAKE_PATTERN='Unable to find a device matching the provided destination specifier'
          attempt=1
          max_attempts=3
          while true; do
            set +e
            xcodebuild test \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -destination "platform=iOS Simulator,name=$DEVICE_NAME" \
              -only-testing:"$ONLY_TESTING" \
              CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log
            exit_code=${PIPESTATUS[0]}
            set -e

            if [ "$exit_code" -eq 0 ]; then
              break
            fi

            if [ "$attempt" -ge "$max_attempts" ] || ! grep -qE "$KNOWN_FLAKE_PATTERN" build.log; then
              exit "$exit_code"
            fi

            echo "::warning::Known flake detected (attempt $attempt/$max_attempts) - retrying in 15s..."
            attempt=$((attempt + 1))
            sleep 15
          done
